[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaglof"
version = "0.1.0"
description = "KaraGLOF — GLOF susceptibility and warning-sign research prototype for the Karakoram (Hunza, Shimshal, Shigar)"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (NFR-1) so Colab and CI
# install exactly the same versions. Keep this list empty on purpose.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `api` makes `app` importable for the API tests; `src` makes `karaglof`
# importable even without `pip install -e .`.
pythonpath = ["api", "src"]
testpaths = ["tests", "api/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells are display code: imports follow the setup cell, and long
# print lines are easier to read in Colab than wrapped ones.
"notebooks/*" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "karaglof"]
